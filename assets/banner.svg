<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="NoelOrin — BE ANYONE">
  <title>NoelOrin — BE ANYONE</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d16"/>
      <stop offset="0.55" stop-color="#101326"/>
      <stop offset="1" stop-color="#1a0f2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f4f5"/>
      <stop offset="0.55" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <circle cx="1010" cy="86" r="230" fill="url(#glowA)"/>
  <circle cx="1116" cy="286" r="190" fill="url(#glowB)"/>

  <!-- Orbit: a small nod to Ori -->
  <g fill="none" stroke="#a78bfa" stroke-opacity="0.35">
    <ellipse cx="1000" cy="170" rx="150" ry="58" transform="rotate(-18 1000 170)"/>
    <ellipse cx="1000" cy="170" rx="108" ry="40" transform="rotate(-18 1000 170)" stroke-opacity="0.18"/>
  </g>
  <circle cx="1136" cy="122" r="4.5" fill="#67e8f9"/>
  <circle cx="1136" cy="122" r="11" fill="#67e8f9" fill-opacity="0.16"/>
  <circle cx="878" cy="212" r="3" fill="#c4b5fd" fill-opacity="0.9"/>
  <circle cx="958" cy="120" r="2" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="1064" cy="228" r="2" fill="#ffffff" fill-opacity="0.4"/>

  <text x="64" y="150" fill="url(#name)" font-family="Segoe UI, PingFang SC, Hiragino Sans GB, Noto Sans SC, Helvetica Neue, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-2">NoelOrin</text>

  <text x="70" y="200" fill="#a1a1aa" font-family="Segoe UI, PingFang SC, Noto Sans SC, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="7">BE ANYONE.</text>

  <text x="70" y="242" fill="#71717a" font-family="Segoe UI, PingFang SC, Noto Sans SC, Arial, sans-serif" font-size="15" letter-spacing="1.5">前端 · 设计 · 二次元　/　Front-end · Design · ACG</text>

  <rect x="64" y="286" width="520" height="2" rx="1" fill="url(#rule)"/>

  <g font-family="Segoe UI, PingFang SC, Noto Sans SC, Arial, sans-serif" font-size="12" fill="#52525b">
    <text x="64" y="318">Go · TypeScript · React · Vue · Python · Cloudflare</text>
  </g>
